<script th:fragment="commonJs" th:inline="javascript">
 if (!window._swupInstance) {
  window._swupInstance =
   typeof Swup === "function"
    ? new Swup()
    : {
       hooks: {
        on() {},
       },
      };
 }
 const swup = window._swupInstance;

 if ("scrollRestoration" in history) {
  history.scrollRestoration = "manual";
 }

 function resetPageScroll() {
  requestAnimationFrame(() => {
   window.scrollTo(0, 0);
   document.documentElement.scrollTop = 0;
   document.body.scrollTop = 0;

   const scrollContainer = document.querySelector(".campaign-canvas, .detail-canvas");
   if (scrollContainer) {
    scrollContainer.scrollTop = 0;
   }
  });
 }

 function syncPageShell() {
  const isDetail = document.querySelector(".detail-shell");
  const isCampaign = document.querySelector(".campaign-shell");
  const mainMenu = document.querySelector(".main-menu");

  document.body.classList.toggle("detail-page", Boolean(isDetail));
  document.body.classList.toggle("campaign-page", Boolean(isCampaign));

  if (mainMenu && isCampaign) {
   mainMenu.classList.remove("side-index");
  }
 }

 function initIndexObserver() {
  const pageRoot = document.querySelector(".campaign-canvas");
  if (!pageRoot) return;

  const allTabs = document.querySelectorAll(".main-menu a");
  allTabs.forEach((tab) => tab.classList.remove("active-tab"));

  const animationObserver = new IntersectionObserver(
   (entries) => {
    entries.forEach((entry) => {
     if (entry.isIntersecting) {
      entry.target.classList.add("is-visible");
     }
    });
   },
   { threshold: 0.1, rootMargin: "-20% 0px -20% 0px" },
  );

  const navObserver = new IntersectionObserver(
   (entries) => {
    entries.forEach((entry) => {
     if (entry.isIntersecting) {
      const sectionId = entry.target.id;
      const allTabs = document.querySelectorAll(".main-menu a");
      allTabs.forEach((tab) => tab.classList.remove("active-tab"));

      const activeTab = document.querySelector(`.main-menu a.theme-${sectionId}`);
      if (activeTab) {
       activeTab.classList.add("active-tab");
      }
     }
    });
   },
   { threshold: 0, rootMargin: "-40% 0px -60% 0px" },
  );

  document.querySelectorAll(".scroll-section").forEach((section) => {
   animationObserver.observe(section);
   navObserver.observe(section);
  });

  if (window.location.hash) {
   scrollToHashTarget(window.location.hash, "smooth");
  }
 }

 function scrollToHashTarget(hash, behavior = "smooth") {
  if (!hash || hash === "#") return;

  const target = document.querySelector(hash);
  if (!target) return;

  setTimeout(() => {
   target.scrollIntoView({ behavior, block: "start" });

   const sectionId = target.id;
   if (sectionId) {
    const allTabs = document.querySelectorAll(".main-menu a");
    allTabs.forEach((tab) => tab.classList.remove("active-tab"));

    const activeTab = document.querySelector(`.main-menu a.theme-${sectionId}`);
    if (activeTab) {
     activeTab.classList.add("active-tab");
    }
   }
  }, 120);
 }

 function initMenuNavigation() {
  document.querySelectorAll(".main-menu a").forEach((link) => {
   if (link.dataset.menuBound === "true") return;
   link.dataset.menuBound = "true";

   link.addEventListener("click", () => {
    const hash = new URL(link.href, window.location.href).hash;
    if (document.querySelector(".campaign-shell") && hash) {
     setTimeout(() => scrollToHashTarget(hash), 0);
    }
   });
  });
 }

 window.addEventListener("scroll", () => {
  const mainMenu = document.querySelector(".main-menu");
  const isDetail = document.querySelector(".is-detail");
  const isCampaign = document.querySelector(".campaign-shell");

  if (mainMenu && isCampaign) {
   mainMenu.classList.remove("side-index");
   return;
  }

  if (mainMenu && !isDetail) {
   if (window.scrollY > 80) {
    mainMenu.classList.add("side-index");
   } else {
    mainMenu.classList.remove("side-index");
   }
  }
 });

 function initHeroRoleSlot() {
  const slot = document.querySelector(".role-slot");
  const slotText = document.getElementById("heroRoleSlot");

  if (window._heroRoleSlotTimer) {
   clearInterval(window._heroRoleSlotTimer);
   window._heroRoleSlotTimer = null;
  }

  if (!slot || !slotText) return;

  const roles = ["웹개발자", "디자이너"];
  let index = roles.indexOf(slotText.textContent.trim());
  if (index < 0) index = 0;

  const spin = () => {
   let tick = 0;
   slot.classList.add("is-spinning");

   const scramble = setInterval(() => {
    slotText.textContent = roles[tick % roles.length];
    tick += 1;
   }, 80);

   setTimeout(() => {
    clearInterval(scramble);
    index = (index + 1) % roles.length;
    slotText.textContent = roles[index];
    slot.classList.remove("is-spinning");
   }, 620);
  };

  window._heroRoleSlotTimer = setInterval(spin, 2400);
 }

 function initBouncingHearts() {
  if (window._heroHeartFrame) {
   cancelAnimationFrame(window._heroHeartFrame);
   window._heroHeartFrame = null;
  }

  const hero = document.querySelector(".campaign-hero");
  const hearts = Array.from(document.querySelectorAll(".heart-pop"));
  if (!hero || hearts.length === 0) return;

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const randomBetween = (min, max) => min + Math.random() * (max - min);

  const makeState = () => {
   const bounds = hero.getBoundingClientRect();
   return hearts.map((heart, index) => {
    const width = heart.offsetWidth || 24;
    const height = heart.offsetHeight || 24;
    const maxX = Math.max(bounds.width - width, 0);
    const maxY = Math.max(bounds.height - height, 0);
    const speed = randomBetween(34, 58);
    const angle = randomBetween(0, Math.PI * 2);

    return {
     heart,
     width,
     height,
     x: randomBetween(0, maxX),
     y: randomBetween(0, maxY),
     vx: Math.cos(angle) * speed,
     vy: Math.sin(angle) * speed,
    };
   });
  };

  let state = makeState();
  let lastTime = performance.now();

  const paint = () => {
   state.forEach(({ heart, x, y }) => {
    heart.style.setProperty("--heart-x", `${x}px`);
    heart.style.setProperty("--heart-y", `${y}px`);
   });
  };

  paint();
  if (reduceMotion) return;

  const tick = (time) => {
   const bounds = hero.getBoundingClientRect();
   const delta = Math.min((time - lastTime) / 1000, 0.05);
   lastTime = time;

   state.forEach((item) => {
    const maxX = Math.max(bounds.width - item.width, 0);
    const maxY = Math.max(bounds.height - item.height, 0);

    item.x += item.vx * delta;
    item.y += item.vy * delta;

    if (item.x <= 0 || item.x >= maxX) {
     item.x = Math.min(maxX, Math.max(0, item.x));
     item.vx *= -1;
    }

    if (item.y <= 0 || item.y >= maxY) {
     item.y = Math.min(maxY, Math.max(0, item.y));
     item.vy *= -1;
    }

    item.heart.style.setProperty("--heart-x", `${item.x}px`);
    item.heart.style.setProperty("--heart-y", `${item.y}px`);
   });

   window._heroHeartFrame = requestAnimationFrame(tick);
  };

  window._heroHeartFrame = requestAnimationFrame(tick);

  if (!window._heroHeartResizeBound) {
   window._heroHeartResizeBound = true;
   window.addEventListener("resize", () => {
    clearTimeout(window._heroHeartResizeTimer);
    window._heroHeartResizeTimer = setTimeout(initBouncingHearts, 120);
   });
  }
 }

 function initHomeConceptDrag() {
  const concept = document.querySelector(".home-concept");
  if (!concept) return;

  const design = concept.querySelector(".concept-frame-design");
  const web = concept.querySelector(".concept-frame-web");
  const path = concept.querySelector(".concept-path path");
  const svg = concept.querySelector(".concept-path");
  if (!design || !web || !path || !svg) return;

  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

  const getPosition = (frame) => {
   const frameRect = frame.getBoundingClientRect();
   const conceptRect = concept.getBoundingClientRect();
   return {
    x: frameRect.left - conceptRect.left,
    y: frameRect.top - conceptRect.top,
    width: frameRect.width,
    height: frameRect.height,
   };
  };

  const setPosition = (frame, x, y) => {
   const position = getClampedPosition(frame, x, y);
   frame.style.left = `${position.x}px`;
   frame.style.top = `${position.y}px`;
   frame.style.right = "auto";
   frame.style.bottom = "auto";
   return position;
  };

  const getClampedPosition = (frame, x, y) => {
   const maxX = Math.max(concept.clientWidth - frame.offsetWidth, 0);
   const maxY = Math.max(concept.clientHeight - frame.offsetHeight, 0);
   return {
    x: clamp(x, 0, maxX),
    y: clamp(y, 0, maxY),
   };
  };

  const drawPath = () => {
   const designPos = getPosition(design);
   const webPos = getPosition(web);
   const designCenterX = designPos.x + designPos.width * 0.5;
   const designCenterY = designPos.y + designPos.height * 0.5;
   const webCenterX = webPos.x + webPos.width * 0.5;
   const webCenterY = webPos.y + webPos.height * 0.5;
   const overlapX = Math.min(designPos.x + designPos.width, webPos.x + webPos.width) - Math.max(designPos.x, webPos.x);
   const useVerticalConnection = overlapX > 0;
   let start;
   let end;
   let pathData;

   if (useVerticalConnection) {
    const designIsLower = designCenterY >= webCenterY;
    start = {
     x: designCenterX,
     y: designIsLower ? designPos.y : designPos.y + designPos.height,
    };
    end = {
     x: webCenterX,
     y: designIsLower ? webPos.y + webPos.height : webPos.y,
    };
    const curve = Math.max(42, Math.abs(start.y - end.y) * 0.8);
    const startControlY = start.y + (designIsLower ? -curve : curve);
    const endControlY = end.y + (designIsLower ? curve : -curve);
    pathData = `M ${start.x} ${start.y} C ${start.x} ${startControlY}, ${end.x} ${endControlY}, ${end.x} ${end.y}`;
   } else {
    const designIsLeft = designCenterX <= webCenterX;
    start = {
     x: designIsLeft ? designPos.x + designPos.width : designPos.x,
     y: designCenterY,
    };
    end = {
     x: designIsLeft ? webPos.x : webPos.x + webPos.width,
     y: webCenterY,
    };
    const distance = Math.max(70, Math.abs(end.x - start.x));
    const curve = distance * 0.42;
    const dip = (end.y - start.y) * 0.18;
    pathData = `M ${start.x} ${start.y} C ${start.x + curve} ${start.y + dip}, ${end.x - curve} ${end.y - dip}, ${end.x} ${end.y}`;
   }

   svg.setAttribute("viewBox", `0 0 ${concept.clientWidth} ${concept.clientHeight}`);
   path.setAttribute("d", pathData);
  };

  const syncInitialPositions = () => {
   const designPos = getPosition(design);
   const webPos = getPosition(web);
   setPosition(design, designPos.x, designPos.y);
   setPosition(web, webPos.x, webPos.y);
   drawPath();
  };

  syncInitialPositions();

  if (concept.dataset.dragBound === "true") {
   drawPath();
   return;
  }
  concept.dataset.dragBound = "true";

  const bindDrag = (active, follower) => {
   active.addEventListener("selectstart", (event) => {
    event.preventDefault();
   });

   active.addEventListener("dragstart", (event) => {
    event.preventDefault();
   });

   active.addEventListener("pointerdown", (event) => {
     event.preventDefault();
     window.getSelection()?.removeAllRanges();
     active.setPointerCapture(event.pointerId);
     active.classList.add("is-dragging");

    const activeStart = getPosition(active);
    const followerStart = getPosition(follower);
    const pointerStart = { x: event.clientX, y: event.clientY };

    const move = (moveEvent) => {
     moveEvent.preventDefault();
     window.getSelection()?.removeAllRanges();
     const deltaX = moveEvent.clientX - pointerStart.x;
     const deltaY = moveEvent.clientY - pointerStart.y;
     const followerNext = {
      ...followerStart,
      ...getClampedPosition(follower, followerStart.x + deltaX * 0.38, followerStart.y),
     };
     const activeNext = {
      ...activeStart,
      ...getClampedPosition(active, activeStart.x + deltaX, activeStart.y + deltaY),
     };

     setPosition(follower, followerNext.x, followerNext.y);
     setPosition(active, activeNext.x, activeNext.y);
     drawPath();
    };

    const release = () => {
     active.classList.remove("is-dragging");
     active.removeEventListener("pointermove", move);
     active.removeEventListener("pointerup", release);
     active.removeEventListener("pointercancel", release);
    };

    active.addEventListener("pointermove", move);
    active.addEventListener("pointerup", release);
    active.addEventListener("pointercancel", release);
   });
  };

  bindDrag(design, web);
  bindDrag(web, design);

  if (!window._homeConceptResizeBound) {
   window._homeConceptResizeBound = true;
   window.addEventListener("resize", () => {
    clearTimeout(window._homeConceptResizeTimer);
    window._homeConceptResizeTimer = setTimeout(initHomeConceptDrag, 120);
   });
  }
 }

 function initDesignGalleryControls() {
  document.querySelectorAll("[data-gallery]").forEach((gallery) => {
   if (gallery.dataset.galleryBound === "true") return;
   gallery.dataset.galleryBound = "true";

   const track = gallery.querySelector(".gallery-track");
   const cards = Array.from(gallery.querySelectorAll(".gallery-card"));
   const current = gallery.querySelector("[data-gallery-current]");
   const total = gallery.querySelector("[data-gallery-total]");
   const dots = gallery.querySelector("[data-gallery-dots]");
   const prev = gallery.querySelector("[data-gallery-prev]");
   const next = gallery.querySelector("[data-gallery-next]");
   if (!track || cards.length === 0) return;

    let activePage = 0;

    const getCardsPerPage = () => (window.matchMedia("(max-width: 640px)").matches ? 1 : 2);

    const getTotalPages = () => Math.max(1, Math.ceil(cards.length / getCardsPerPage()));

   const getGap = () => {
    const styles = window.getComputedStyle(track);
    return Number.parseFloat(styles.columnGap || styles.gap || "0") || 0;
   };

   const getImageRatio = (card) => {
    const image = card.querySelector("img");
    if (!image || !image.naturalWidth || !image.naturalHeight) return 1;
    return image.naturalWidth / image.naturalHeight;
   };

   const syncGalleryLayout = () => {
    const cardsPerPage = getCardsPerPage();
    const startIndex = activePage * cardsPerPage;
    const visibleCards = cards.slice(startIndex, startIndex + cardsPerPage);
    const activeHeight = visibleCards.reduce((height, card) => {
     const image = card.querySelector("img");
     if (!image) return Math.max(height, card.offsetHeight || 0);

     const ratio = getImageRatio(card);
     const imageStyles = window.getComputedStyle(image);
     const maxHeight = Number.parseFloat(imageStyles.maxHeight) || Infinity;
     const targetHeight = Math.min(card.clientWidth / ratio, maxHeight);
     return Math.max(height, targetHeight || image.offsetHeight || card.offsetHeight || 0);
    }, 0);

    if (activeHeight > 0) {
     gallery.style.setProperty("--gallery-active-height", `${activeHeight}px`);
    }
   };

    const syncCardWidths = () => {
     const cardsPerPage = getCardsPerPage();
     const gap = getGap();
     const availableWidth = Math.max(track.clientWidth - gap * (cardsPerPage - 1), 0);

     if (cardsPerPage === 1) {
      cards.forEach((card) => {
       card.style.setProperty("--gallery-card-width", `${track.clientWidth}px`);
      });
      syncGalleryLayout();
      return;
     }

     for (let index = 0; index < cards.length; index += cardsPerPage) {
     const pair = cards.slice(index, index + cardsPerPage);

     if (pair.length === 1) {
      pair[0].style.setProperty("--gallery-card-width", `${track.clientWidth}px`);
      continue;
     }

     const ratios = pair.map(getImageRatio);
     const totalRatio = ratios.reduce((sum, ratio) => sum + ratio, 0) || pair.length;

     const minWidth = availableWidth * 0.34;
     const maxWidth = availableWidth * 0.66;
     let firstWidth = availableWidth * (ratios[0] / totalRatio);
     firstWidth = Math.min(maxWidth, Math.max(minWidth, firstWidth));
     const secondWidth = availableWidth - firstWidth;

     pair[0].style.setProperty("--gallery-card-width", `${firstWidth}px`);
     pair[1].style.setProperty("--gallery-card-width", `${secondWidth}px`);
    }
    syncGalleryLayout();
   };

    const syncDots = () => {
     if (!dots) return;

     const totalPages = getTotalPages();
     if (dots.children.length !== totalPages) {
      dots.replaceChildren(
       ...Array.from({ length: totalPages }, (_, index) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "gallery-dot";
        dot.setAttribute("aria-label", `Go to image group ${index + 1}`);
        dot.addEventListener("click", () => goTo(index));
        return dot;
       }),
      );
     }

     Array.from(dots.children).forEach((dot, index) => {
      dot.classList.toggle("is-active", index === activePage);
     });
    };

    const updateCount = () => {
     const totalPages = getTotalPages();
     activePage = Math.min(activePage, totalPages - 1);
     if (current) {
      current.textContent = String(activePage + 1);
     }
    if (total) {
     total.textContent = String(totalPages);
    }
    syncGalleryLayout();
    syncDots();
   };

    const goTo = (page) => {
     const cardsPerPage = getCardsPerPage();
     const totalPages = getTotalPages();
     activePage = Math.min(totalPages - 1, Math.max(0, page));
     const firstCardIndex = activePage * cardsPerPage;
    track.scrollTo({
     left: cards[firstCardIndex].offsetLeft - track.offsetLeft,
     behavior: "smooth",
    });
    updateCount();
   };

   if (prev) {
    prev.addEventListener("click", () => goTo(activePage - 1));
   }

   if (next) {
    next.addEventListener("click", () => goTo(activePage + 1));
   }

   track.addEventListener("scroll", () => {
     window.clearTimeout(track._galleryScrollTimer);
     track._galleryScrollTimer = window.setTimeout(() => {
      const cardsPerPage = getCardsPerPage();
      const totalPages = getTotalPages();
      const pageStarts = Array.from({ length: totalPages }, (_, index) => {
       const card = cards[index * cardsPerPage];
      return card ? card.offsetLeft - track.offsetLeft : 0;
     });
     const closest = pageStarts.reduce(
      (result, left, page) => {
       const distance = Math.abs(track.scrollLeft - left);
       return distance < result.distance ? { page, distance } : result;
      },
      { page: activePage, distance: Infinity },
     );
     activePage = closest.page;
     updateCount();
    }, 80);
   });

   const images = cards.map((card) => card.querySelector("img")).filter(Boolean);
   images.forEach((image) => {
    if (!image.complete) {
     image.addEventListener("load", syncCardWidths, { once: true });
    }
   });

    window.addEventListener("resize", () => {
     window.clearTimeout(track._galleryResizeTimer);
     track._galleryResizeTimer = window.setTimeout(() => {
      syncCardWidths();
      activePage = Math.min(activePage, getTotalPages() - 1);
      goTo(activePage);
     }, 120);
   });

   syncCardWidths();
   updateCount();
  });
 }

 function initHomePage() {
  syncPageShell();
  resetPageScroll();
  initMenuNavigation();

  const isDetailPage = document.querySelector(".is-detail");
  if (!isDetailPage) {
   initIndexObserver();
  }

  initHeroRoleSlot();
  initBouncingHearts();
  initHomeConceptDrag();
  initDesignGalleryControls();

  const guestbookList = document.querySelector(".guest-list");
  if (guestbookList) {
   guestbookList.addEventListener("click", (e) => {
    if (e.target.classList.contains("delete-btn")) {
     e.preventDefault();
     const guestId = e.target.getAttribute("data-id");
     const password = prompt("삭제를 위해 비밀번호를 입력해주세요.");
     if (password) {
      const form = document.createElement("form");
      form.method = "POST";
      form.action = `/guest/delete/${guestId}`;
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = "password";
      input.value = password;
      form.appendChild(input);
      document.body.appendChild(form);
      form.submit();
     }
    }
   });
  }
 }

 document.addEventListener("DOMContentLoaded", initHomePage);
 swup.hooks?.on?.("page:view", () => {
  resetPageScroll();
  initHomePage();
 });
</script>
