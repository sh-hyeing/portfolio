<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Work Detail</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
 </head>
 <body>
  <main id="swup">
   <div class="folder-frame theme-work is-detail">
    <div th:replace="~{fragments/nav :: mainMenu('work')}"></div>

    <div class="document-paper">
     <div class="paper-content-area transition-fade">
      <div class="back-nav">
       <a th:href="@{/#work}" class="back-link">← BACK</a>
      </div>

      <div class="detail-content">
       <header class="detail-header">
        <h1 class="detail-title">디지털 아카이빙 플랫폼</h1>
        <div class="header-meta">
         <p class="detail-period">2025.11. - 2025.12.</p>
         <a href="https://letter-concept.vercel.app/" target="_blank" class="visit-btn">VISIT SITE ↗</a>
        </div>
       </header>

       <div class="detail-main">
        <section class="detail-text-section">
         <h3>summary</h3>
         <p class="detail-description"><strong>프로젝트 개요</strong>: 창작 교류 운영 웹페이지 지원</p>
         <p class="detail-description"><strong>주요 특징</strong>: 행사 컨셉에 적합한 레이아웃 디자인 구현</p>
         <p class="detail-description"><strong>주요 기능</strong>: 공지 확인, 갤러리 리스트, Firebase 기반 방명록</p>

         <div class="detail-tags">
          <span>HTML5</span>
          <span>Javascript</span>
          <span>Thymeleaf</span>
          <span>React</span>
          <span>Vercel</span>
          <span>Firebase</span>
         </div>
        </section>
       </div>
      </div>
     </div>
    </div>
   </div>
  </main>

  <script src="https://unpkg.com/swup@4"></script>
  <script th:replace="~{fragments/script :: commonJs}"></script>
 </body>
</html>
