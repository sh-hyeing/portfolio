<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>portfolio</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
 </head>
 <body class="detail-page">
  <main id="swup">
   <div class="detail-shell is-detail" th:classappend="${#strings.equals(project.title, 'Portfolio') ? 'portfolio-project' : (project.galleryImages == null or project.galleryImages.isEmpty()) ? 'no-wide-visual' : ''}">
    <div th:replace="~{fragments/nav :: mainMenu('work')}"></div>

    <article class="detail-canvas transition-fade">
     <header class="detail-hero">
      <div class="detail-copy">
       <p class="detail-label" th:text="${#strings.equals(project.type, 'Design') ? '# design' : '# website'}"># website</p>
       <h1 class="detail-title" th:text="${project.title}">Project Title</h1>
       <a th:if="${project.visitUrl != null and !#strings.isEmpty(project.visitUrl)}" th:href="${project.visitUrl}" target="_blank" rel="noopener" class="detail-visit-link">Visit site</a>
      </div>
      <figure class="detail-hero-visual">
       <picture>
        <source th:if="${!#strings.equals(project.type, 'Learning Tool') and project.imageWebp != null and !#strings.isEmpty(project.imageWebp)}" th:srcset="@{${project.imageWebp}}" type="image/webp" />
        <img th:if="${#strings.equals(project.type, 'Design')}" th:src="@{/images/yourfit-detail-hero.webp}" th:alt="${project.imageAlt}" />
        <img th:if="${#strings.equals(project.type, 'Learning Tool')}" th:src="@{/images/youtube-script-detail-hero.webp}" th:alt="${project.imageAlt}" />
        <img th:if="${!#strings.equals(project.type, 'Design') and !#strings.equals(project.type, 'Learning Tool')}" th:src="@{${project.imagePng}}" th:alt="${project.imageAlt}" />
       </picture>
      </figure>
     </header>

     <section class="detail-intro">
      <p class="detail-subtitle" th:text="${project.subtitle}">Project subtitle</p>
     </section>

     <section class="detail-wide-visual" aria-label="Project preview" th:if="${#strings.equals(project.title, 'Portfolio') or (project.galleryImages != null and !project.galleryImages.isEmpty())}">
      <picture class="detail-wide-picture" th:if="${#strings.equals(project.title, 'Portfolio')}">
       <img th:src="@{/images/portfolio-detail-sections.webp}" alt="Portfolio section overview" loading="lazy" />
      </picture>
      <picture class="detail-wide-picture" th:if="${!#strings.equals(project.title, 'Portfolio') and project.galleryImages != null and project.galleryImages.size() == 1}" th:with="image=${project.galleryImages.get(0)}">
       <img th:src="@{${image.src}}" th:alt="${image.alt}" loading="lazy" />
      </picture>
      <div class="detail-gallery" th:if="${!#strings.equals(project.title, 'Portfolio') and project.galleryImages != null and project.galleryImages.size() > 1}">
       <div class="gallery-frame" data-gallery>
        <div class="gallery-track" aria-label="Design project images">
         <figure class="gallery-card" th:each="image : ${project.galleryImages}">
          <img th:src="@{${image.src}}" th:alt="${image.alt}" loading="lazy" />
         </figure>
        </div>
        <div class="gallery-controls" aria-label="Gallery controls">
         <button type="button" class="gallery-btn gallery-btn-prev" data-gallery-prev aria-label="Previous image"></button>
         <span class="gallery-dots" data-gallery-dots aria-label="Gallery pages"></span>
         <span class="gallery-status" aria-live="polite"><span data-gallery-current>1</span>/<span data-gallery-total>1</span></span>
         <button type="button" class="gallery-btn gallery-btn-next" data-gallery-next aria-label="Next image"></button>
        </div>
       </div>
      </div>
     </section>

     <section class="detail-info-list" aria-label="Project information">
      <article class="detail-info-row" th:each="summary : ${project.summaries}">
       <h2 class="detail-info-label" th:text="${summary.label}">목표</h2>
       <p class="detail-info-text" th:text="${summary.text}">예시 문장입니다.</p>
      </article>
      <article class="detail-info-row">
       <h2 class="detail-info-label">제작 기간</h2>
       <div class="detail-info-stack">
        <p th:each="period : ${project.periods}">
         <span th:text="${period.label}">기획</span>
         <span th:text="${period.duration}">1주</span>
        </p>
       </div>
      </article>
      <article class="detail-info-row" th:if="${project.tags != null and !project.tags.isEmpty()}">
       <h2 class="detail-info-label">사용 도구</h2>
       <p class="detail-info-tools"><span th:each="tag : ${project.tags}" th:text="${tag}">Tool</span></p>
      </article>
     </section>
    </article>
   </div>
   <div th:replace="~{fragments/footer :: siteFooter}"></div>
  </main>

  <script src="https://unpkg.com/swup@4"></script>
  <script th:replace="~{fragments/script :: commonJs}"></script>
 </body>
</html>
